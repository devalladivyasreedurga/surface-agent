[project]
name = "computer-use-automation"
version = "0.1.0"
description = "Computer-use automation system: LLM discovery, typed capability artifacts, deterministic replay, safety guardrails, human escalation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "playwright>=1.48",
    "anthropic>=0.39",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
