{% extends "base.html" %}
{% block title %}Open Sub-Account{% endblock %}
{% block content %}
<h1>Open Sub-Account &mdash; {{ member.name if member else member_id }}</h1>

{% if error %}
<table class="notice-table"><tr><td class="notice-error">{{ error }}</td></tr></table>
{% endif %}

<form action="/members/{{ member_id }}/sub-account/review" method="post">
  <table>
    <tr>
      <td><label for="account_type">Account Type</label></td>
      <td>
        <select id="account_type" name="account_type">
          <option value="savings">Savings</option>
          <option value="checking">Checking</option>
          <option value="cd">Certificate of Deposit</option>
        </select>
      </td>
    </tr>
    <tr>
      <td><label for="initial_deposit">Initial Deposit</label></td>
      <td><input type="text" id="initial_deposit" name="initial_deposit" placeholder="e.g. 100.00"></td>
    </tr>
    <tr>
      <td colspan="2"><button type="submit">Continue to Review</button></td>
    </tr>
  </table>
</form>
<p><a href="/members/{{ member_id }}">Back to Member</a></p>
{% endblock %}
